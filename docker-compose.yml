# One-command local stack.
#
# There is no separate queue or database container: the MVP queue runs inside
# the Go process and persists to SQLite on the shared volume. That is a direct
# consequence of the in-process queue decision, not an omission.
#
# There is no WebUI container either. The interface is a static export embedded
# in the vsd binary and served on the same port as the API, which also removes
# the cross-origin configuration the two-service split needed.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Set GOPROXY in the environment to build behind a restricted network.
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    container_name: video-stream-app
    ports:
      - "8080:8080"
    environment:
      VS_SERVER_ADDR: ":8080"
      VS_SIDECAR_BASE_URL: "http://sidecar:8090"
      VS_DATA_DIR: "/var/lib/video-stream"
      VS_OUTPUT_DIR: "/var/lib/video-stream/output"
      VS_LOG_LEVEL: "info"
      VS_LOG_FORMAT: "json"
      VS_TELEMETRY_ENABLED: "true"
    volumes:
      - vs-data:/var/lib/video-stream
    restart: unless-stopped

  sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    container_name: video-stream-sidecar
    ports:
      - "8090:8090"
    environment:
      VS_UPSTREAM_URL: "http://app:8080"
    volumes:
      - vs-data:/var/lib/video-stream
    restart: unless-stopped

volumes:
  vs-data:
