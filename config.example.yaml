# vs configuration — every field is optional.
#
# Copy this to the path `vs doctor` reports (usually ~/.config/vs/config.yaml on
# Linux, ~/Library/Application Support/vs/config.yaml on macOS) and delete
# everything you do not want to change. The built-in defaults shown here are
# what runs when there is no file at all.
#
# Precedence: defaults < this file < VS_ environment variables < command flags.
# No secret belongs in here; use `vs credential set` instead.

# External binaries. Bare names are looked up on PATH.
tools:
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  python: python3

# Speech recognition, used by transcribe, subtitle and filler.
asr:
  backend: faster-whisper
  # tiny / base / small / medium / large-v3, or a converted model directory.
  # Bigger is slower and more accurate; small is a reasonable default for
  # Chinese, large-v3 is noticeably better on names and technical terms.
  model: small
  # Two-letter code. Empty autodetects, which costs an extra pass and
  # occasionally guesses wrong on a video that opens with music.
  language: ""
  device: auto          # auto | cpu | cuda
  compute_type: auto    # auto | int8 | int8_float16 | float16 | float32
  model_dir: ""         # where downloaded models are cached
  threads: 0            # 0 lets the backend decide
  # Leave this on. Whisper invents fluent sentences to fill long silences.
  vad: true

# Default caption geometry and look. Colors are ASS &HBBGGRR — blue, green,
# red — which is the order libass reads, not RGB.
subtitle:
  font: ""              # e.g. "PingFang SC", "Source Han Sans"
  font_size: 42
  primary_color: "&H00FFFFFF"
  outline_color: "&H00000000"
  outline: 2
  shadow: 0
  margin_v: 60
  position: bottom      # bottom | center | top
  max_chars: 20         # per line; 20 suits Chinese, 42 suits English
  max_lines: 2

# What `vs filler` considers worth cutting.
filler:
  # Added to the built-in hesitation list.
  extra_words: []
  # Removed from it, for a speaker whose "嗯" carries meaning.
  keep_words: []
  # Silence longer than this is shortened to it, not closed: speech spliced to
  # a zero gap sounds like a machine did it.
  max_pause: 700ms
  # Every cut is pulled back from its neighbours by this much, because word
  # boundaries from a recognizer are approximate.
  pad_head: 60ms
  pad_tail: 80ms
  # Surviving fragments shorter than this are dropped; a 40ms island of speech
  # reads as a glitch rather than as a word.
  min_keep: 200ms

# Output encoding, applied whenever a command has to re-encode.
encode:
  video_codec: libx264
  audio_codec: aac
  crf: 20               # lower is better; 18 is visually lossless
  preset: medium        # ultrafast .. veryslow
  audio_bitrate: 192k

# Diagnostics. Normal command output does not go through the logger.
logging:
  level: warn           # debug | info | warn | error
  format: text          # text | json

# Where API keys are stored. The keys themselves never appear in this file.
credentials:
  backend: auto         # auto | keychain | vault | env
  vault_path: ""        # defaults to credentials.vault beside this file

# Hosted model providers, for commands that call one. Nothing in the editing
# commands needs this: recognition and every ffmpeg operation run locally.
providers: []
#  - name: openai
#    base_url: https://api.openai.com/v1
#    model: gpt-4o-mini
#    protocol: openai
