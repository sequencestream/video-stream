# video-stream configuration.
#
# Copy to config.yaml and adjust. Every field can also be set through a VS_-
# prefixed environment variable, which takes precedence over this file.
#
# There is no field anywhere in this file for an API key, and that is not an
# omission. Keys live in your OS keychain or an encrypted vault on your own
# machine; store one with `vs credential set <provider>`. See
# doc/arch/credentials.md.

server:
  addr: ":8080" # VS_SERVER_ADDR

sidecar:
  base_url: "http://127.0.0.1:8090" # VS_SIDECAR_BASE_URL
  timeout: 5s # VS_SIDECAR_TIMEOUT

storage:
  data_dir: "./data" # VS_DATA_DIR — holds video-stream.db
  output_dir: "./output" # VS_OUTPUT_DIR — holds rendered artifacts

budget:
  max_cost_per_video_usd: 2.0 # VS_MAX_COST_PER_VIDEO_USD
  daily_cap_usd: 20.0 # VS_DAILY_CAP_USD

logging:
  level: "info" # VS_LOG_LEVEL — debug | info | warn | error
  format: "json" # VS_LOG_FORMAT — json | text

telemetry:
  enabled: false # VS_TELEMETRY_ENABLED
  endpoint: "" # VS_TELEMETRY_ENDPOINT — reserved for a remote sink

queue:
  workers: 2 # VS_QUEUE_WORKERS
  buffer: 64 # VS_QUEUE_BUFFER

radar:
  interval: 6h # VS_RADAR_INTERVAL — zero disables background polling
  per_minute: 6 # VS_RADAR_PER_MINUTE — requests per platform per minute; zero means unlimited
  burst: 1 # VS_RADAR_BURST — back-to-back grants after idle

credentials:
  # VS_CREDENTIALS_BACKEND — where secrets are read from and written to:
  #   auto     environment, then OS keychain, then encrypted vault (default)
  #   keychain environment, then OS keychain; fails at startup without one
  #   vault    environment, then the encrypted vault file
  #   env      environment variables only
  backend: "auto"
  # VS_CREDENTIALS_VAULT_PATH — defaults to <data_dir>/credentials.vault.
  # Unlock it with VS_VAULT_PASSPHRASE, or let `vs` prompt on a terminal.
  vault_path: ""

  vault_path: ""

notifications:
  webhook_url: "" # VS_NOTIFY_WEBHOOK_URL
  email_to: "" # VS_NOTIFY_EMAIL_TO
  smtp_host: ""
  smtp_port: 587
  smtp_from: "video-stream@localhost"
  smtp_user: ""

# Providers carry metadata only. Each one's key is looked up under
# "provider/<name>" in the credential store.
providers:
  - name: "openai"
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    protocol: "openai"
  # Any OpenAI-compatible endpoint works by pointing base_url at it.
  - name: "dashscope"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen-plus"
    protocol: "openai"
